<?php
$db_reviews = array();
if (isset($conn) && $conn) {
    $res_rev = @mysqli_query($conn, "SELECT c.*, q.space_type, q.addr, q.film_name, q.py FROM case_comments c LEFT JOIN quotes q ON c.case_no = q.no ORDER BY c.no DESC");
    if ($res_rev && mysqli_num_rows($res_rev) > 0) {
        while ($r = mysqli_fetch_assoc($res_rev)) {
            $db_reviews[] = $r;
        }
    }
}
