<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCeramic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#121620"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glowCeramic">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="16" fill="url(#bgCeramic)" stroke="#27272a" stroke-width="1.5"/>

  <!-- Grid texture -->
  <path d="M0 85 H600 M0 170 H600 M0 255 H600 M150 0 V340 M300 0 V340 M450 0 V340" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Wireless Signal Waves (RF / GPS / Hi-Pass) -->
  <g filter="url(#glowCeramic)" opacity="0.85">
    <path d="M 210 170 A 90 90 0 0 1 390 170" fill="none" stroke="url(#signalGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
    <path d="M 235 170 A 65 65 0 0 1 365 170" fill="none" stroke="url(#signalGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 260 170 A 40 40 0 0 1 340 170" fill="none" stroke="url(#signalGrad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="300" cy="170" r="8" fill="#60a5fa"/>
  </g>

  <!-- Car Window Frame Silhouette -->
  <path d="M 120 230 Q 300 130 480 230 L 450 250 H 150 Z" fill="rgba(17, 24, 39, 0.8)" stroke="#4b5563" stroke-width="2"/>

  <!-- Signal Free Icon Badge -->
  <g transform="translate(470, 45)">
    <rect x="-40" y="-15" width="80" height="30" rx="15" fill="rgba(59, 130, 246, 0.15)" stroke="#60a5fa" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#93c5fd" font-family="Pretendard, sans-serif" font-size="12" font-weight="700">RF PASS 100%</text>
  </g>

  <!-- Text Overlay -->
  <text x="300" y="280" text-anchor="middle" fill="#ffffff" font-family="Pretendard, sans-serif" font-size="20" font-weight="800" letter-spacing="1">나노 세라믹 딥블랙</text>
  <text x="300" y="308" text-anchor="middle" fill="#9ca3af" font-family="Pretendard, sans-serif" font-size="13" font-weight="500">GPS · 하이패스 무전파 간섭 &amp; 순정 차콜 감성</text>
</svg>
