<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="50%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8B88C"/>
      <stop offset="100%" stop-color="#e6dbc4"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="20" fill="url(#bgGrad)" stroke="#2a2a2a" stroke-width="2"/>

  <!-- Grid lines -->
  <path d="M0 100 H600 M0 200 H600 M0 300 H600 M150 0 V400 M300 0 V400 M450 0 V400" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Optical Wave Lines (Filtered Blue Light) -->
  <path d="M 50 150 Q 150 100 250 150 T 450 150 T 550 150" fill="none" stroke="url(#blueGrad)" stroke-width="6" filter="url(#glow)"/>
  <path d="M 50 250 Q 150 200 250 250 T 450 250 T 550 250" fill="none" stroke="url(#blueGrad)" stroke-width="4" opacity="0.7"/>

  <!-- Protective Optical Shield Frame -->
  <circle cx="300" cy="190" r="80" fill="#0d0d0d" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="300" cy="190" r="66" fill="rgba(200, 184, 140, 0.08)" stroke="#C8B88C" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Eye Symbol -->
  <path d="M 255 190 C 270 160, 330 160, 345 190 C 330 220, 270 220, 255 190 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="300" cy="190" r="14" fill="url(#goldGrad)"/>
  <circle cx="304" cy="186" r="4" fill="#ffffff"/>

  <!-- Text Overlay -->
  <text x="300" y="320" text-anchor="middle" fill="#C8B88C" font-family="Pretendard, sans-serif" font-size="22" font-weight="800" letter-spacing="2">BLUE LIGHT CUT TECH</text>
  <text x="300" y="350" text-anchor="middle" fill="#a1a1aa" font-family="Pretendard, sans-serif" font-size="14" font-weight="600">시신경 피로 감소 &amp; 안구 보호 차단 광학 솔루션</text>
</svg>
