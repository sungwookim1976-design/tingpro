<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSputter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="50%" stop-color="#191712"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="goldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8B88C"/>
      <stop offset="100%" stop-color="#f3e5ab"/>
    </linearGradient>
    <linearGradient id="sunRayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C8B88C" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="emeraldShield" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glowSputter">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="16" fill="url(#bgSputter)" stroke="url(#goldGold)" stroke-width="1.5"/>

  <!-- Sun Rays hitting shield -->
  <g filter="url(#glowSputter)">
    <!-- Scorching Sun rays bouncing off -->
    <path d="M 60 40 L 220 160 Q 140 180 60 210" fill="none" stroke="url(#sunRayGrad)" stroke-width="4"/>
    <path d="M 110 30 L 250 170 Q 170 200 80 250" fill="none" stroke="url(#sunRayGrad)" stroke-width="5"/>
    <path d="M 160 20 L 280 180 Q 200 230 110 290" fill="none" stroke="url(#sunRayGrad)" stroke-width="3"/>
  </g>

  <!-- Metallic Emerald Sputter Mirror Shield -->
  <path d="M 270 90 L 410 130 C 410 220 340 270 270 290 C 200 270 130 220 130 130 Z" fill="url(#bgSputter)" stroke="url(#goldGold)" stroke-width="3" filter="url(#glowSputter)"/>
  <path d="M 270 105 L 395 140 C 395 210 335 255 270 273 C 205 255 145 210 145 140 Z" fill="rgba(200, 184, 140, 0.08)" stroke="url(#emeraldShield)" stroke-width="2"/>

  <!-- Temperature Drop Badge -->
  <g transform="translate(300, 175)">
    <circle cx="0" cy="0" r="32" fill="#0d0d0d" stroke="url(#goldGold)" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" fill="#C8B88C" font-family="Pretendard, sans-serif" font-size="16" font-weight="800">-10℃</text>
    <text x="0" y="14" text-anchor="middle" fill="#34d399" font-family="Pretendard, sans-serif" font-size="9" font-weight="700">체감온도</text>
  </g>

  <!-- Heat Reflection Badge -->
  <g transform="translate(480, 45)">
    <rect x="-45" y="-15" width="90" height="30" rx="15" fill="rgba(200, 184, 140, 0.2)" stroke="#C8B88C" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#f3e5ab" font-family="Pretendard, sans-serif" font-size="11" font-weight="700">MAX HEAT SHIELD</text>
  </g>

  <!-- Text Overlay -->
  <text x="300" y="308" text-anchor="middle" fill="#f3e5ab" font-family="Pretendard, sans-serif" font-size="18" font-weight="800" letter-spacing="1">뷰럭스 스퍼터 반사 필름</text>
</svg>
