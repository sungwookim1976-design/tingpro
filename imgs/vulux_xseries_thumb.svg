<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <linearGradient id="xBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="50%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#0a0d0a"/>
    </linearGradient>
    <linearGradient id="xGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8B88C"/>
      <stop offset="50%" stop-color="#f3e5ab"/>
      <stop offset="100%" stop-color="#d9cb9e"/>
    </linearGradient>
    <linearGradient id="xEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="xGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" rx="20" fill="url(#xBg)" stroke="url(#xGold)" stroke-width="1.5"/>

  <!-- Tech Grid Background -->
  <path d="M0 95 H800 M0 190 H800 M0 285 H800 M200 0 V380 M400 0 V380 M600 0 V380" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Glowing Luxury Metallic Optics Wave -->
  <path d="M 50 190 Q 200 110 400 190 T 750 190" fill="none" stroke="url(#xEmerald)" stroke-width="4" filter="url(#xGlow)"/>
  <path d="M 50 210 Q 200 130 400 210 T 750 210" fill="none" stroke="url(#xGold)" stroke-width="2" opacity="0.6"/>

  <!-- Center Luxury X Series Crown Seal -->
  <g transform="translate(400, 160)" filter="url(#xGlow)">
    <circle cx="0" cy="0" r="75" fill="#0d0d0d" stroke="url(#xGold)" stroke-width="3"/>
    <circle cx="0" cy="0" r="64" fill="rgba(200, 184, 140, 0.08)" stroke="#C8B88C" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <!-- Crown icon -->
    <path d="M -22 -15 L -14 10 L 0 -5 L 14 10 L 22 -15 L 12 -22 L 0 -12 L -12 -22 Z" fill="url(#xGold)"/>
    
    <text x="0" y="24" text-anchor="middle" fill="#ffffff" font-family="Pretendard, sans-serif" font-size="20" font-weight="900" letter-spacing="3">VULUX X</text>
    <text x="0" y="44" text-anchor="middle" fill="#C8B88C" font-family="Pretendard, sans-serif" font-size="10" font-weight="700" letter-spacing="2">SERIES MASTER</text>
  </g>

  <!-- 3 Performance Stat Badges -->
  <!-- Stat 1: UV 99.9% -->
  <g transform="translate(140, 160)">
    <rect x="-65" y="-35" width="130" height="70" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(200, 184, 140, 0.3)" stroke-width="1"/>
    <text x="0" y="-8" text-anchor="middle" fill="#C8B88C" font-family="Pretendard, sans-serif" font-size="22" font-weight="800">99.9%</text>
    <text x="0" y="16" text-anchor="middle" fill="#9ca3af" font-family="Pretendard, sans-serif" font-size="12" font-weight="600">자외선(UV) 차단</text>
  </g>

  <!-- Stat 2: IR 99.1% -->
  <g transform="translate(660, 160)">
    <rect x="-65" y="-35" width="130" height="70" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(200, 184, 140, 0.3)" stroke-width="1"/>
    <text x="0" y="-8" text-anchor="middle" fill="#34d399" font-family="Pretendard, sans-serif" font-size="22" font-weight="800">99.1%</text>
    <text x="0" y="16" text-anchor="middle" fill="#9ca3af" font-family="Pretendard, sans-serif" font-size="12" font-weight="600">유해 적외선(IR)</text>
  </g>

  <!-- Stat 3: Reflection 5.1% -->
  <g transform="translate(400, 290)">
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="rgba(200, 184, 140, 0.15)" stroke="#C8B88C" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#f3e5ab" font-family="Pretendard, sans-serif" font-size="13" font-weight="700">실내 유리 반사율 5.1% (눈부림 무방해)</text>
  </g>

  <!-- Top Badge Header -->
  <text x="400" y="45" text-anchor="middle" fill="#C8B88C" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" letter-spacing="3">HIGH END SPUTTERING MULTI LAYER TECHNOLOGY</text>
</svg>
